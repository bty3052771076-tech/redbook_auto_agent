[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redbook-tools"
version = "0.1.0"
description = "Versioned editorial tools for the Redbook CLI and agent"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*", "redbook_tools*"]
namespaces = true
